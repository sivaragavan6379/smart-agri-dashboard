<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enter Your Name</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
    }
    .form-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      text-align: center;
    }
    input {
      padding: 10px;
      margin: 10px 0;
      width: 200px;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
      border: none;
      background: #007BFF;
      color: white;
      border-radius: 5px;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>Enter Your Name</h2>
    <form onsubmit="goToWelcome(event)">
      <input type="text" id="name" placeholder="Your Name" required>
      <br>
      <button type="submit">Confirm</button>
    </form>
  </div>

  <script>
    function goToWelcome(e) {
      e.preventDefault();
      let name = document.getElementById("name").value.trim().toLowerCase(); 
      // convert to lowercase for matching
      window.location.href = `welcome.html?name=${encodeURIComponent(name)}`;
    }
  </script>
</body>
</html>
